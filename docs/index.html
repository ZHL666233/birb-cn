    <script>
        // 汉化辅助：让 Canvas 内文字在中文字符时回退到系统中文字体（英文仍用像素字体）
        (function () {
            var ZH = "'Microsoft YaHei','PingFang SC','Noto Sans SC','WenQuanYi Micro Hei',sans-serif";
            try {
                var proto = CanvasRenderingContext2D.prototype;
                var desc = Object.getOwnPropertyDescriptor(proto, 'font');
                if (desc && desc.set) {
                    Object.defineProperty(proto, 'font', {
                        configurable: true,
                        get: desc.get,
                        set: function (v) {
                            if (typeof v === 'string' && /Tiny5|PixelOperator/.test(v) && !/YaHei|PingFang|Noto Sans|WenQuanYi/.test(v)) {
                                v = v.replace(/(Tiny5|PixelOperator[A-Za-z ]*|PixelOperatorMono)/, '$&,' + ZH);
                            }
                            desc.set.call(this, v);
                        }
                    });
                }
            } catch (e) { }
        })();
    </script>
    <script>
        // 保护：localStorage 配额满/被禁用时，读写静默失败，避免游戏启动崩溃
        (function () {
            try {
                var sp = Storage.prototype;
                ['getItem', 'setItem', 'removeItem'].forEach(function (name) {
                    var orig = sp[name];
                    sp[name] = function () {
                        try { return orig.apply(this, arguments); }
                        catch (e) { return name === 'getItem' ? null : undefined; }
                    };
                });
            } catch (e) { }
        })();
    </script>
